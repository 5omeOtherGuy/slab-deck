version: 2
updates:
  # The gate's locked tools; @anthropic-ai/claude-code is also the host version the mod's tests run against.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels: [dependencies]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels: [dependencies]
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
