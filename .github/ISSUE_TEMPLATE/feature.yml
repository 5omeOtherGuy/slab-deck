name: Feature request
description: A problem slab-deck could solve, then your idea for it.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like slab-deck to help, and any alternatives you considered.
    validations:
      required: false
